basePath: /api/v1
definitions:
  commands.AdjustStockRequest:
    properties:
      delta:
        description: positivo = entrada, negativo = saida
        type: integer
    required:
    - delta
    type: object
  commands.AuthResponse:
    properties:
      access_token:
        type: string
      expires_in:
        description: segundos ate expirar
        type: integer
      refresh_token:
        type: string
      token_type:
        description: '"Bearer"'
        type: string
    type: object
  commands.AverageExecutionTimeResponse:
    properties:
      average_human:
        example: 1h30m0s
        type: string
      average_seconds:
        example: 5400
        type: number
    type: object
  commands.CancelServiceOrderRequest:
    properties:
      reason:
        example: cliente desistiu do serviço
        type: string
    type: object
  commands.CreatePartRequest:
    properties:
      description:
        type: string
      manufacturer_code:
        type: string
      name:
        type: string
      price:
        type: number
      stock:
        minimum: 0
        type: integer
      unit:
        type: string
    required:
    - manufacturer_code
    - name
    - price
    - unit
    type: object
  commands.CreateRequesterRequest:
    properties:
      document:
        type: string
      email:
        type: string
      name:
        type: string
      phone:
        type: string
    required:
    - document
    - email
    - name
    type: object
  commands.CreateServiceOrderRequest:
    properties:
      notes:
        type: string
      requester_document:
        type: string
      vehicle_plate:
        type: string
    required:
    - requester_document
    - vehicle_plate
    type: object
  commands.CreateServiceRequest:
    properties:
      code:
        type: integer
      description:
        type: string
      duration_min:
        type: integer
      name:
        type: string
      price:
        type: number
    required:
    - code
    - duration_min
    - name
    - price
    type: object
  commands.CreateVehicleRequest:
    properties:
      brand:
        type: string
      model:
        type: string
      plate:
        type: string
      requester_document:
        type: string
      year:
        type: integer
    required:
    - brand
    - model
    - plate
    - requester_document
    - year
    type: object
  commands.LoginRequest:
    properties:
      email:
        maxLength: 255
        type: string
      password:
        maxLength: 128
        type: string
    required:
    - email
    - password
    type: object
  commands.MessageResponse:
    properties:
      message:
        type: string
    type: object
  commands.PartItemResponse:
    properties:
      description:
        type: string
      manufacturer_code:
        type: string
      part_id:
        type: string
      quantity:
        type: integer
      unit_price:
        type: number
    type: object
  commands.PartResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      manufacturer_code:
        type: string
      name:
        type: string
      price:
        type: number
      stock:
        type: integer
      unit:
        type: string
      updated_at:
        type: string
    type: object
  commands.RefreshRequest:
    properties:
      refresh_token:
        maxLength: 255
        type: string
    required:
    - refresh_token
    type: object
  commands.RegisterRequest:
    properties:
      email:
        maxLength: 255
        type: string
      name:
        maxLength: 100
        type: string
      password:
        maxLength: 128
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  commands.RequesterResponse:
    properties:
      created_at:
        type: string
      document:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      phone:
        type: string
      updated_at:
        type: string
    type: object
  commands.SagaResponse:
    properties:
      budget_id:
        type: string
      checkout_url:
        type: string
      deadline_at:
        type: string
      failure_reason:
        type: string
      id:
        type: string
      payment_id:
        type: string
      state:
        allOf:
        - $ref: '#/definitions/entities.SagaState'
        example: awaiting_approval
    type: object
  commands.ServiceItemResponse:
    properties:
      code:
        type: integer
      description:
        type: string
      price:
        type: number
      service_id:
        type: string
    type: object
  commands.ServiceOrderDetailsResponse:
    properties:
      budget:
        type: object
      execution:
        type: object
      history:
        items:
          $ref: '#/definitions/commands.StatusHistoryResponse'
        type: array
      partial:
        type: boolean
      saga:
        $ref: '#/definitions/commands.SagaResponse'
      service_order:
        $ref: '#/definitions/commands.ServiceOrderResponse'
      unavailable:
        items:
          type: string
        type: array
    type: object
  commands.ServiceOrderResponse:
    properties:
      cancel_reason:
        type: string
      code:
        type: integer
      created_at:
        type: string
      finished_at:
        type: string
      id:
        type: string
      notes:
        type: string
      parts:
        items:
          $ref: '#/definitions/commands.PartItemResponse'
        type: array
      requester_id:
        type: string
      services:
        items:
          $ref: '#/definitions/commands.ServiceItemResponse'
        type: array
      started_at:
        type: string
      status:
        $ref: '#/definitions/entities.OrderStatus'
      total_amount:
        type: number
      updated_at:
        type: string
      vehicle_id:
        type: string
      version:
        type: integer
    type: object
  commands.ServiceResponse:
    properties:
      code:
        type: integer
      created_at:
        type: string
      description:
        type: string
      duration_min:
        type: integer
      id:
        type: string
      name:
        type: string
      price:
        type: number
      updated_at:
        type: string
    type: object
  commands.StatusHistoryResponse:
    properties:
      actor:
        example: saga
        type: string
      at:
        type: string
      from:
        $ref: '#/definitions/entities.OrderStatus'
      message_id:
        type: string
      reason:
        type: string
      to:
        $ref: '#/definitions/entities.OrderStatus'
    type: object
  commands.UpdatePartRequest:
    properties:
      description:
        type: string
      manufacturer_code:
        type: string
      name:
        type: string
      price:
        type: number
      stock:
        minimum: 0
        type: integer
      unit:
        type: string
    type: object
  commands.UpdateRequesterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      phone:
        type: string
    type: object
  commands.UpdateServiceRequest:
    properties:
      code:
        type: integer
      description:
        type: string
      duration_min:
        type: integer
      name:
        type: string
      price:
        type: number
    type: object
  commands.UpdateVehicleRequest:
    properties:
      brand:
        type: string
      model:
        type: string
      plate:
        type: string
      year:
        type: integer
    type: object
  commands.VehicleResponse:
    properties:
      brand:
        type: string
      created_at:
        type: string
      id:
        type: string
      model:
        type: string
      plate:
        type: string
      requester_id:
        type: string
      updated_at:
        type: string
      year:
        type: integer
    type: object
  entities.OrderStatus:
    enum:
    - received
    - in_diagnosis
    - awaiting_budget
    - awaiting_approval
    - awaiting_payment
    - in_execution
    - finished
    - delivered
    - cancelled
    type: string
    x-enum-comments:
      StatusAwaitingApproval: Aguardando aprovação do cliente
      StatusAwaitingBudget: Diagnosticada, orçamento em geração
      StatusAwaitingPayment: Aprovada, aguardando pagamento
      StatusCancelled: Cancelada (compensação da saga ou oficina)
      StatusDelivered: Entregue
      StatusFinished: Finalizada
      StatusInDiagnosis: Em diagnóstico
      StatusInExecution: Paga, em execução
      StatusReceived: Recebida
    x-enum-varnames:
    - StatusReceived
    - StatusInDiagnosis
    - StatusAwaitingBudget
    - StatusAwaitingApproval
    - StatusAwaitingPayment
    - StatusInExecution
    - StatusFinished
    - StatusDelivered
    - StatusCancelled
  entities.SagaState:
    enum:
    - awaiting_diagnosis
    - awaiting_budget
    - awaiting_approval
    - awaiting_payment
    - executing
    - completed
    - compensating
    - cancelled
    type: string
    x-enum-comments:
      SagaAwaitingApproval: orçamento criado, cliente decide
      SagaAwaitingBudget: peças reservadas, CreateBudget enviado
      SagaAwaitingDiagnosis: StartDiagnosis enviado
      SagaAwaitingPayment: RequestPayment enviado
      SagaCancelled: compensações concluídas
      SagaCompensating: aguardando confirmação do estorno
      SagaCompleted: reparo concluído
      SagaExecuting: pago, StartRepair enviado
    x-enum-varnames:
    - SagaAwaitingDiagnosis
    - SagaAwaitingBudget
    - SagaAwaitingApproval
    - SagaAwaitingPayment
    - SagaExecuting
    - SagaCompleted
    - SagaCompensating
    - SagaCancelled
  httputil.ErrorBody:
    properties:
      code:
        example: NOT_FOUND
        type: string
      message:
        example: service order not found
        type: string
    type: object
  httputil.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/httputil.ErrorBody'
    type: object
  internalapi.RequesterResponse:
    properties:
      document:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      status:
        example: active
        type: string
    type: object
info:
  contact: {}
  description: |-
    Ordens de serviço, clientes, veículos, catálogo e estoque. Orquestra a saga da OS
    (execution-service e billing-service) via SNS/SQS com outbox e consumidor idempotente.
  title: OS Service — Oficina Mecânica
  version: "2.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Credenciais
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/commands.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/commands.AuthResponse'
      summary: Autenticar usuario
      tags:
      - auth
  /auth/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/commands.MessageResponse'
      security:
      - BearerAuth: []
      summary: Encerrar sessao (revoga todos os refresh tokens)
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/commands.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/commands.AuthResponse'
      summary: Renovar tokens (refresh token rotation)
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Dados do usuario
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/commands.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/commands.MessageResponse'
      summary: Registrar usuario
      tags:
      - auth
  /internal/requesters/{document}:
    get:
      description: Rota servida fora do prefixo /api/v1, em GET /internal/requesters/{document};
        não é exposta no API Gateway.
      parameters:
      - description: CPF ou CNPJ (só dígitos)
        in: path
        name: document
        required: true
        type: string
      - description: Token interno
        in: header
        name: X-Internal-Token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internalapi.RequesterResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: Cliente por CPF/CNPJ (uso interno da Lambda de autenticação)
      tags:
      - internal
  /parts:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/commands.PartResponse'
            type: array
      security:
      - BearerAuth: []
      summary: Listar pecas/insumos
      tags:
      - parts
    post:
      consumes:
      - application/json
      parameters:
      - description: Dados da peca
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/commands.CreatePartRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/commands.PartResponse'
      security:
      - BearerAuth: []
      summary: Cadastrar peca/insumo
      tags:
      - parts
  /parts/{id}:
    delete:
      parameters:
      - description: Part ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Deletar peca/insumo
      tags:
      - parts
    get:
      parameters:
      - description: Part ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/commands.PartResponse'
      security:
      - BearerAuth: []
      summary: Buscar peca/insumo por ID
      tags:
      - parts
    put:
      consumes:
      - application/json
      parameters:
      - description: Part ID
        in: path
        name: id
        required: true
        type: string
      - description: Dados para atualizar
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/commands.UpdatePartRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/commands.PartResponse'
      security:
      - BearerAuth: []
      summary: Atualizar peca/insumo
      tags:
      - parts
  /parts/{id}/stock:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Part ID
        in: path
        name: id
        required: true
        type: string
      - description: Delta de estoque
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/commands.AdjustStockRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Ajustar estoque de peca/insumo
      tags:
      - parts
  /requesters:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/commands.RequesterResponse'
            type: array
      security:
      - BearerAuth: []
      summary: Listar clientes
      tags:
      - requesters
    post:
      consumes:
      - application/json
      parameters:
      - description: Dados do cliente
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/commands.CreateRequesterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/commands.RequesterResponse'
      security:
      - BearerAuth: []
      summary: Criar cliente
      tags:
      - requesters
  /requesters/{id}:
    delete:
      parameters:
      - description: Requester ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Deletar cliente
      tags:
      - requesters
    get:
      parameters:
      - description: Requester ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/commands.RequesterResponse'
      security:
      - BearerAuth: []
      summary: Buscar cliente por ID
      tags:
      - requesters
    put:
      consumes:
      - application/json
      parameters:
      - description: Requester ID
        in: path
        name: id
        required: true
        type: string
      - description: Dados para atualizar
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/commands.UpdateRequesterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/commands.RequesterResponse'
      security:
      - BearerAuth: []
      summary: Atualizar cliente
      tags:
      - requesters
  /requesters/{id}/vehicles:
    get:
      description: Retorna todos os veiculos cadastrados para o cliente identificado
        pelo ID.
      parameters:
      - description: ID do cliente (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/commands.VehicleResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar veiculos de um cliente
      tags:
      - requesters
  /requesters/document/{document}:
    get:
      parameters:
      - description: Requester Document
        in: path
        name: document
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Buscar cliente por documento
      tags:
      - requesters
  /service-orders:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/commands.ServiceOrderResponse'
            type: array
      security:
      - BearerAuth: []
      summary: Listar ordens de servico
      tags:
      - service-orders
    post:
      consumes:
      - application/json
      description: |-
        Abre a OS e inicia a saga (StartDiagnosis para o execution-service). Com
        FAULT_INJECTION_ENABLED=true, o header X-Simulate-Failure (budget, payment ou
        repair) força a falha da etapa para demonstrar as compensações.
      parameters:
      - description: Dados da OS
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/commands.CreateServiceOrderRequest'
      - description: 'Falha simulada: budget, payment ou repair'
        in: header
        name: X-Simulate-Failure
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/commands.ServiceOrderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Criar ordem de servico
      tags:
      - service-orders
  /service-orders/{id}:
    get:
      parameters:
      - description: ServiceOrder ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/commands.ServiceOrderResponse'
      security:
      - BearerAuth: []
      summary: Buscar ordem de servico por ID
      tags:
      - service-orders
  /service-orders/{id}/cancel:
    post:
      consumes:
      - application/json
      description: |-
        Compensa as etapas já concluídas da saga (estorno, orçamento, peças, execução) e
        encerra a OS como cancelled. OS finalizada ou entregue não pode ser cancelada.
      parameters:
      - description: ServiceOrder ID
        in: path
        name: id
        required: true
        type: string
      - description: Motivo
        in: body
        name: body
        schema:
          $ref: '#/definitions/commands.CancelServiceOrderRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Cancelar OS (oficina)
      tags:
      - service-orders
  /service-orders/{id}/deliver:
    post:
      description: finished → delivered.
      parameters:
      - description: ServiceOrder ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Registrar entrega do veículo
      tags:
      - service-orders
  /service-orders/{id}/details:
    get:
      description: |-
        Junta a OS e a saga (os-service), o orçamento e o pagamento (billing-service) e a
        execução (execution-service). Se um serviço não responder, a resposta é parcial:
        o campo dele vem nulo e o nome aparece em "unavailable".
      parameters:
      - description: ServiceOrder ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/commands.ServiceOrderDetailsResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Visão completa da OS (API composition)
      tags:
      - service-orders
  /service-orders/{id}/history:
    get:
      parameters:
      - description: ServiceOrder ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/commands.StatusHistoryResponse'
            type: array
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Histórico de status da OS
      tags:
      - service-orders
  /service-orders/code/{code}:
    get:
      parameters:
      - description: Codigo da OS
        in: path
        name: code
        required: true
        type: integer
      - description: CPF ou CNPJ do cliente
        in: query
        name: document
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/commands.ServiceOrderResponse'
      security:
      - BearerAuth: []
      summary: Consultar OS pelo codigo (cliente autenticado por CPF)
      tags:
      - service-orders-requester
