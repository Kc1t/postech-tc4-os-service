sonar.projectKey=postech-tc4-os-service
sonar.projectName=postech-tc4-os-service
sonar.sources=.
sonar.exclusions=**/*_test.go,**/mocks/**,docs/**,infra/**,k8s/**,deploy/**,scripts/**,test/**,features/**,migrations/**,bin/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go
