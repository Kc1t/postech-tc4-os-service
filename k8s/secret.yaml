# Modelo. No CI o Secret é criado com `kubectl create secret ... --from-literal` a partir dos
# secrets do GitHub; os valores abaixo são só marcadores.
apiVersion: v1
kind: Secret
metadata:
  name: os-service-secret
type: Opaque
stringData:
  JWT_SECRET: CHANGE_ME
  POSTGRES_DSN: CHANGE_ME
  ADMIN_PASSWORD: CHANGE_ME
  INTERNAL_API_TOKEN: CHANGE_ME
  NEW_RELIC_LICENSE_KEY: ""
