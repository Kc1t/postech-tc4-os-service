apiVersion: v1
kind: ResourceQuota
metadata:
  name: oficina-quota
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 4Gi
    limits.cpu: "10"
    limits.memory: 10Gi
    pods: "30"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: oficina-quota
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "1"
        memory: 1Gi
