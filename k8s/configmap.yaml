apiVersion: v1
kind: ConfigMap
metadata:
  name: os-service-config
data:
  APP_PORT: "8080"
  APP_ENV: "prod"
  LOG_LEVEL: "info"
  NEW_RELIC_APP_NAME: "os-service-NAMESPACE_PLACEHOLDER"
  ACCESS_TOKEN_EXP_MIN: "15"
  REFRESH_TOKEN_EXP_DAYS: "7"
  BCRYPT_COST: "12"
  MAX_FAILED_LOGINS: "5"
  LOGIN_LOCK_MIN: "15"
  ADMIN_EMAIL: "admin@workshop.com"
  CORS_ALLOWED_ORIGINS: "CORS_ORIGINS_PLACEHOLDER"
  # Mensageria: credenciais vêm do role do node (LabRole no Learner Lab).
  AWS_REGION: "AWS_REGION_PLACEHOLDER"
  SQS_SAGA_REPLIES_URL: "https://sqs.AWS_REGION_PLACEHOLDER.amazonaws.com/ACCOUNT_ID_PLACEHOLDER/os-saga-replies"
  SQS_BILLING_COMMANDS_URL: "https://sqs.AWS_REGION_PLACEHOLDER.amazonaws.com/ACCOUNT_ID_PLACEHOLDER/billing-commands"
  SQS_EXECUTION_COMMANDS_URL: "https://sqs.AWS_REGION_PLACEHOLDER.amazonaws.com/ACCOUNT_ID_PLACEHOLDER/execution-commands"
  SNS_OS_EVENTS_ARN: "arn:aws:sns:AWS_REGION_PLACEHOLDER:ACCOUNT_ID_PLACEHOLDER:os-events"
  OUTBOX_POLL_INTERVAL: "500ms"
  SAGA_APPROVAL_TIMEOUT: "72h"
  SAGA_PAYMENT_TIMEOUT: "24h"
  SAGA_TIMEOUT_CHECK_INTERVAL: "1m"
  FAULT_INJECTION_ENABLED: "FAULT_INJECTION_PLACEHOLDER"
  # API composition: Services ClusterIP dos outros microsserviços no mesmo namespace.
  BILLING_SERVICE_URL: "http://billing-service"
  EXECUTION_SERVICE_URL: "http://execution-service"
  UPSTREAM_TIMEOUT: "2s"
  SHUTDOWN_TIMEOUT: "20s"
