name: CI/CD

on:
  pull_request:
    branches: [main, homolog]
  push:
    branches: [main, homolog]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SERVICE: os-service
  PROJECT: postech-tc4
  NAMESPACE: postech
  TF_VERSION: 1.9.8
  GOLANGCI_LINT_VERSION: v2.15.0
  GOSEC_VERSION: v2.30.0
  SWAG_VERSION: v1.16.3
  MIN_COVERAGE: 80

jobs:
  quality:
    name: Lint, SAST e dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go.mod arrumado
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: gofmt
        run: test -z "$(git ls-files '*.go' | grep -v '^docs/' | xargs gofmt -l)"

      - name: go vet
        run: go vet ./... && go vet -tags bdd ./...

      - name: golangci-lint (gosec, errorlint, bodyclose, noctx...)
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m --build-tags bdd --output.text.path=stdout --output.checkstyle.path=golangci-report.xml

      - name: gosec (relatório para o SonarQube)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@"${GOSEC_VERSION}"
          gosec -exclude-dir=test -exclude-dir=docs -exclude-dir=scripts -exclude-generated -fmt=sonarqube -out=gosec-report.json -no-fail ./...
          gosec -quiet -exclude-dir=test -exclude-dir=docs -exclude-dir=scripts -exclude-generated -severity=medium -confidence=medium ./...

      - name: Swagger em dia com o código
        run: |
          go install github.com/swaggo/swag/cmd/swag@"${SWAG_VERSION}"
          make swagger
          git diff --exit-code docs/ || { echo "::error::docs/ desatualizado: rode make swagger"; exit 1; }

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...

      - uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            golangci-report.xml
            gosec-report.json
          retention-days: 7

  tests:
    name: Testes e cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Subir dependências de teste
        run: |
          make test-db
          for _ in $(seq 1 30); do docker exec tc4-pg-test pg_isready -U test -d testdb && break; sleep 2; done

      - name: Testes unitários e de integração com cobertura
        run: make cover

      - name: Cobertura mínima de ${{ env.MIN_COVERAGE }}%
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%","",$3); print $3}')
          echo "### Cobertura do $SERVICE: ${total}%" >> "$GITHUB_STEP_SUMMARY"
          awk -v t="$total" -v m="$MIN_COVERAGE" 'BEGIN { exit (t+0 >= m+0) ? 0 : 1 }' \
            || { echo "::error::cobertura ${total}% abaixo de ${MIN_COVERAGE}%"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  bdd:
    name: BDD da saga (godog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Subir dependências de teste
        run: |
          make test-db
          for _ in $(seq 1 30); do docker exec tc4-pg-test pg_isready -U test -d testdb && break; sleep 2; done

      - run: make bdd

  sonarqube:
    name: SonarQube (quality gate)
    needs: [quality, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: "{lint-reports,coverage}"
          merge-multiple: true

      - name: Análise e quality gate
        env:
          SONAR_PROJECT_KEY: postech-tc4-os-service
        run: .github/scripts/sonar.sh

  terraform:
    name: Terraform do banco (fmt, validate, tfsec)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

      - uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infra

  image:
    name: Imagem (build e Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t "$SERVICE:ci" .

      - name: Vulnerabilidades (relatório HIGH e CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.SERVICE }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Vulnerabilidades (bloqueia CRITICAL com correção disponível)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.SERVICE }}:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

  # Só a main faz deploy, e só com a variável AWS_DEPLOY_ENABLED=true: as credenciais do Learner
  # Lab expiram a cada sessão, e sem elas o push não deve ficar vermelho.
  deploy:
    name: Deploy no EKS
    needs: [quality, tests, bdd, sonarqube, terraform, image]
    if: github.event_name != 'pull_request' && github.ref_name == 'main' && vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Banco do serviço (terraform apply)
        working-directory: infra
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${SERVICE}/prod.tfstate" \
            -backend-config="region=$AWS_REGION"
          terraform apply -input=false -auto-approve -var-file=envs/prod.tfvars

      - name: Ler a DSN do banco no Secrets Manager
        working-directory: infra
        run: |
          secret=$(terraform output -raw db_credentials_secret_name)
          dsn=$(aws secretsmanager get-secret-value --secret-id "$secret" --query SecretString --output text | jq -r .dsn)
          echo "::add-mask::$dsn"
          echo "POSTGRES_DSN=$dsn" >> "$GITHUB_ENV"

      - name: Login no ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push da imagem
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          aws ecr describe-repositories --repository-names "$SERVICE" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$SERVICE" --image-scanning-configuration scanOnPush=true >/dev/null
          IMAGE="$REGISTRY/$SERVICE:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: kubectl no cluster
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "${{ vars.EKS_CLUSTER_NAME || 'postech-tc4-prod' }}"

      - name: Secret do serviço
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic "$SERVICE-secret" --namespace "$NAMESPACE" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}" \
            --from-literal=INTERNAL_API_TOKEN="${{ secrets.INTERNAL_API_TOKEN }}" \
            --from-literal=NEW_RELIC_LICENSE_KEY="${{ secrets.NEW_RELIC_LICENSE_KEY }}" \
            --from-literal=POSTGRES_DSN="$POSTGRES_DSN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Renderizar e aplicar os manifests
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          mkdir rendered
          for f in configmap deployment service hpa pdb networkpolicy; do cp "k8s/$f.yaml" rendered/; done
          sed -i "s|IMAGE_PLACEHOLDER|$IMAGE|g; s|NAMESPACE_PLACEHOLDER|$NAMESPACE|g; s|AWS_REGION_PLACEHOLDER|$AWS_REGION|g; s|ACCOUNT_ID_PLACEHOLDER|$ACCOUNT_ID|g; s|CORS_ORIGINS_PLACEHOLDER|${{ vars.CORS_ALLOWED_ORIGINS || 'http://localhost:3000' }}|g; s|FAULT_INJECTION_PLACEHOLDER|${{ vars.FAULT_INJECTION_ENABLED || 'true' }}|g" rendered/*.yaml
          if grep -l "_PLACEHOLDER" rendered/*.yaml; then echo "::error::placeholder sem valor"; exit 1; fi
          kubectl apply -n "$NAMESPACE" -f rendered/

      - name: Rollout
        run: kubectl rollout status "deployment/$SERVICE" -n "$NAMESPACE" --timeout=300s

      - name: Smoke test pelo NLB
        run: |
          for _ in $(seq 1 30); do
            host=$(kubectl get svc "$SERVICE-public" -n "$NAMESPACE" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            [ -n "$host" ] && curl -sf --max-time 5 "http://$host/health/ready" && break
            sleep 10
          done
          curl -sf --max-time 5 "http://$host/health/ready" || { echo "::error::serviço não respondeu pelo NLB"; exit 1; }
          {
            echo "### $SERVICE no ar"
            echo "- imagem: \`$IMAGE\`"
            echo "- NLB: http://$host"
            echo "- rode o workflow do postech-tc4-infra-k8s para ligar as rotas do gateway a este NLB"
          } >> "$GITHUB_STEP_SUMMARY"
