# Ambiente local do os-service: API + Postgres + LocalStack (SNS/SQS/DynamoDB com a mesma
# topologia do Terraform, criada por deploy/localstack/init-aws.sh).
services:
  os-service:
    build: .
    container_name: os-service
    ports:
      - "${OS_SERVICE_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DSN: postgres://postgres:postgres@postgres:5432/workshop?sslmode=disable
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localstack:4566
      SQS_SAGA_REPLIES_URL: http://localstack:4566/000000000000/os-saga-replies
      SQS_BILLING_COMMANDS_URL: http://localstack:4566/000000000000/billing-commands
      SQS_EXECUTION_COMMANDS_URL: http://localstack:4566/000000000000/execution-commands
      SNS_OS_EVENTS_ARN: arn:aws:sns:us-east-1:000000000000:os-events
      FAULT_INJECTION_ENABLED: "true"
      INTERNAL_API_TOKEN: local-internal-token
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: os-postgres
    ports:
      - "${OS_POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workshop
    volumes:
      - os-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3.8
    container_name: os-localstack
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    environment:
      SERVICES: sns,sqs,dynamodb
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./deploy/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    healthcheck:
      # Pronto quando os scripts de init (filas, tópicos, tabelas) terminaram sem erro. O endpoint responde
      # em milissegundos; o awslocal leva uns 3 s para subir e estourava o timeout.
      test: ["CMD-SHELL", "r=$$(curl -sf localhost:4566/_localstack/init/ready) && echo \"$$r\" | grep -q '\"completed\": true' && ! echo \"$$r\" | grep -q ERROR"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  os-postgres-data:
